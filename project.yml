name: DOSBoxer

options:
  bundleIdPrefix: com.dosboxer
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    CORE_BUILD_DIR: $(SRCROOT)/build/core-Release/dosboxer

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.7.0

targets:
  # Swift framework for the UI side: session control, Metal renderer, input.
  # Shared by the app and (later) the standalone game player.
  DOSBoxerKit:
    type: framework
    platform: macOS
    sources:
      - Sources/DOSBoxerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dosboxer.DOSBoxerKit
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Core/include
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/Frameworks"
        DEFINES_MODULE: YES

  DOSBoxerKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DOSBoxerKitTests
    dependencies:
      - target: DOSBoxerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dosboxer.DOSBoxerKitTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Core/include

  # Command-line tool that runs a game collection through DOS Boxer and
  # records which games start (see Sources/DOSBoxerLab/main.swift).
  DOSBoxerLab:
    type: tool
    platform: macOS
    sources:
      - Sources/DOSBoxerLab
    dependencies:
      - target: DOSBoxerKit
        embed: false
      - target: DOS Boxer
        link: false
    settings:
      base:
        PRODUCT_NAME: DOSBoxerLab
        CODE_SIGN_IDENTITY: "-"
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Core/include
        LD_RUNPATH_SEARCH_PATHS: "@executable_path"
        SKIP_INSTALL: YES

  # Helper process that runs one DOS session (the emulator core can only run
  # once per process). Lives in the app's Contents/MacOS.
  DOS Boxer Engine:
    type: tool
    platform: macOS
    sources:
      - path: Sources/DOSBoxerEngine
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: DOS Boxer Engine
        PRODUCT_BUNDLE_IDENTIFIER: com.dosboxer.engine
        CODE_SIGN_ENTITLEMENTS: Sources/DOSBoxerEngine/DOSBoxerEngine.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Core/include
        LIBRARY_SEARCH_PATHS: $(CORE_BUILD_DIR)
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SKIP_INSTALL: YES
    preBuildScripts:
      - name: Build emulator core
        script: |
          export PATH="/opt/homebrew/bin:$PATH"
          "$SRCROOT/Scripts/build-core.sh"
        basedOnDependencyAnalysis: false

  DOS Boxer:
    type: application
    platform: macOS
    sources:
      - path: Sources/DOSBoxerApp
        excludes:
          - Info.plist
      # Made in Icon Composer (layers beside it)
      - path: Resources/AppIcon/AppIcon.icon
        type: file
        buildPhase: resources
      # Licence notices for the open-source code shipped inside the app
      - path: Licenses
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - target: DOSBoxerKit
        embed: true
      - target: DOS Boxer Engine
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: DOS Boxer
        PRODUCT_BUNDLE_IDENTIFIER: com.dosboxer.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/DOSBoxerApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: DOS Boxer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 William Spry. Licensed under GPLv2 or later."
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Core/include
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    postBuildScripts:
      - name: Embed emulator core and resources
        script: '"$SRCROOT/Scripts/embed-core.sh"'
        basedOnDependencyAnalysis: false

schemes:
  DOSBoxerLab:
    build:
      targets:
        DOSBoxerLab: all
    run:
      config: Release
  DOS Boxer:
    build:
      targets:
        DOS Boxer: all
    test:
      targets:
        - DOSBoxerKitTests
    run:
      config: Debug
    archive:
      config: Release
